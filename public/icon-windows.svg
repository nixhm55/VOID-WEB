<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Clean Tinted Liquid Glass Fill (Zero Rainbow/Color Blobs, No Bubble Ellipses) -->
    <linearGradient id="winTintedGlassFill" x1="16" y1="16" x2="104" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="48%" stop-color="#F1F5F9" stop-opacity="0.46"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.30"/>
    </linearGradient>

    <!-- Crisp Specular Liquid Glass Edge Rim -->
    <linearGradient id="winTintedGlassRim" x1="14" y1="14" x2="106" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.78"/>
    </linearGradient>
  </defs>

  <!-- Official Standard 4-Pane Windows Grid -->
  <rect x="16" y="16" width="40" height="40" rx="5" fill="url(#winTintedGlassFill)" stroke="url(#winTintedGlassRim)" stroke-width="1.6"/>
  <rect x="64" y="16" width="40" height="40" rx="5" fill="url(#winTintedGlassFill)" stroke="url(#winTintedGlassRim)" stroke-width="1.6"/>
  <rect x="16" y="64" width="40" height="40" rx="5" fill="url(#winTintedGlassFill)" stroke="url(#winTintedGlassRim)" stroke-width="1.6"/>
  <rect x="64" y="64" width="40" height="40" rx="5" fill="url(#winTintedGlassFill)" stroke="url(#winTintedGlassRim)" stroke-width="1.6"/>
</svg>
